<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QINGWA — Project Index</title>
<meta name="description" content="青蛙 / FROG755 的个人索引站：AI 多智能体协同、开发者工具、内容生产流水线、数据监控与嵌入式项目。">
<link rel="stylesheet" href="assets/css/style.css">
<!-- 粒子背景依赖；加载失败时页面自动降级，不影响其余功能 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<canvas id="particle-canvas" aria-hidden="true"></canvas>

<div class="grid-lines" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span><span></span><span></span>
</div>

<header class="masthead">
  <div class="masthead-inner">
    <div class="brand">
      <div class="brand-mark" id="brand-mark">Q</div>
      <div>
        <span class="brand-name" id="brand-name">QINGWA</span>
        <span class="brand-sub mono" id="brand-sub">FROG755 · PROJECT INDEX</span>
      </div>
    </div>

    <nav class="tabs" id="tabs" role="tablist" aria-label="主入口切换"></nav>

    <div class="masthead-right">
      <span class="clock mono" id="clock"></span>
      <button class="icon-btn is-on" id="fxToggle" title="切换粒子背景" aria-label="切换粒子背景">&#10022;</button>
      <button class="icon-btn" id="themeToggle" title="切换明暗" aria-label="切换明暗">&#9686;</button>
    </div>
  </div>
</header>

<main>
  <section class="view" id="view-index" role="tabpanel"></section>
  <section class="view" id="view-projects" role="tabpanel"></section>
  <section class="view" id="view-notes" role="tabpanel"></section>
  <section class="view" id="view-about" role="tabpanel"></section>
</main>

<footer>
  <div class="foot-inner">
    <span class="mono">&copy; 2026 <span id="foot-name"></span>. ALL RIGHTS RESERVED.</span>
    <span class="mono" id="foot-status"></span>
    <span class="mono" id="foot-contact"></span>
    <a class="mono foot-mail" id="foot-email" href="#"></a>
    <span class="mono">SWISS GRID · 12 COL · HELVETICA</span>
  </div>
</footer>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-bg" id="sheet-bg"></div>
  <div class="sheet-panel" id="sheet-body"></div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
